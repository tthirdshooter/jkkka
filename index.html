<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kho Kho Asia & J&K UT KhoKho Association | Official Portal</title>
    <style>
        :root {
            --asia-blue: rgba(0, 35, 71, 0.85);
            --jk-red: rgba(217, 4, 41, 0.85);
            --accent: #ffb703;
            --white: #ffffff;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Montserrat', sans-serif;
            overflow: hidden;
            background: #000;
        }

        /* --- PRELOADER --- */
        #loader-wrapper {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #001219;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            transition: all 0.8s cubic-bezier(0.645, 0.045, 0.355, 1);
        }

        .loader-icon {
            width: 100px;
            height: 100px;
            border: 4px solid var(--accent);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: pulse 1.5s infinite;
        }

        .loader-icon span {
            color: white;
            font-weight: bold;
            font-size: 1.2rem;
            letter-spacing: 2px;
        }

        @keyframes pulse {
            0% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(255, 183, 3, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 20px rgba(255, 183, 3, 0); }
            100% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(255, 183, 3, 0); }
        }

        .loaded #loader-wrapper {
            transform: translateY(-100%);
        }

        /* --- VIDEO FRAME LAYOUT --- */
        .main-container {
            display: flex;
            height: 100vh;
            width: 100%;
        }

        .frame {
            flex: 1;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .video-bg {
            position: absolute;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            transform: translate(-50%, -50%);
            z-index: 1;
            object-fit: cover;
        }

        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 2;
            transition: background 0.5s ease;
        }

        #asia-side .overlay { background: var(--asia-blue); }
        #jk-side .overlay { background: var(--jk-red); }

        /* Interaction Effect: Darken on hover */
        .frame:hover .overlay {
            background: rgba(0, 0, 0, 0.4) !important;
        }

        .content {
            position: relative;
            z-index: 3;
            color: white;
            padding: 40px;
            max-width: 500px;
            transform: translateY(30px);
            opacity: 0;
            transition: all 1s ease 0.5s;
        }

        .loaded .content {
            transform: translateY(0);
            opacity: 1;
        }

        h1 {
            font-size: 3rem;
            margin: 0;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.5);
            letter-spacing: -1px;
        }

        .btn {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 35px;
            border: 2px solid white;
            color: white;
            text-decoration: none;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s;
        }

        .btn:hover {
            background: white;
            color: black;
        }

        /* Mobile Adjustments */
        @media (max-width: 800px) {
            .main-container { flex-direction: column; }
            h1 { font-size: 2rem; }
        }
    </style>
</head>
<body>

    <div id="loader-wrapper">
        <div class="loader-icon"><span>KK</span></div>
        <div style="color: white; margin-top: 20px; font-family: sans-serif; letter-spacing: 5px;">KHO KHO ASIA</div>
    </div>

    <div class="main-container">
        
        <section id="asia-side" class="frame">
            <video autoplay muted loop playsinline class="video-bg">
                <source src="https://assets.mixkit.co/videos/preview/mixkit-group-of-friends-playing-tug-of-war-at-the-beach-4414-large.mp4" type="video/mp4">
            </video>
            <div class="overlay"></div>
            <div class="content">
                <small style="letter-spacing: 3px; color: var(--accent);">KHOKHO ASIA</small>
                <h1>ASIA<br>Kho-Kho</h1>
                <p>Leading the evolution of Kho Kho across 25+ nations with standardized professional leagues.</p>
                <a href="#" class="btn">Explore Asia</a>
            </div>
        </section>

        <section id="jk-side" class="frame">
            <video autoplay muted loop playsinline class="video-bg">
                <source src="https://assets.mixkit.co/videos/preview/mixkit-athlete-running-on-a-track-at-dusk-1254-large.mp4" type="video/mp4">
            </video>
            <div class="overlay"></div>
            <div class="content">
                <small style="letter-spacing: 3px; color: var(--accent);">REGIONAL PRIDE</small>
                <h1>JAMMU&KASHMIR U.T.<br>KHO-KHO ASSOCIATION</h1>
                <p>Nurturing champions from the valleys of Kashmir to the plains of Jammu.</p>
                <a href="jk.html" class="btn">State Portal</a>
            </div>
        </section>

    </div>

    <script>
        // Smooth transition after loading
        window.addEventListener('load', function() {
            setTimeout(function() {
                document.body.classList.add('loaded');
            }, 2000); // 2-second showcase of loader
        });
    </script>

</body>

</html>
